<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evidence RAG Bench</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">FIXED CORPUS · LOCAL RETRIEVAL</p>
      <h1>Evidence RAG Bench</h1>
      <p class="lede">Search the fixed corpus. If the evidence is thin, the demo says so.</p>
      <form id="ask-form">
        <label for="profile">Corpus</label>
        <select id="profile" name="profile">
          <option value="en-v1">English corpus (en-v1)</option>
          <option value="zh-v1">中文语料（zh-v1）</option>
        </select>
        <label for="question">Question</label>
        <textarea id="question" required maxlength="1000" placeholder="How can FAISS implement cosine similarity?"></textarea>
        <button type="submit">Find supporting passages</button>
      </form>
      <section id="result" aria-live="polite" hidden>
        <p id="status" class="status"></p>
        <p id="answer"></p>
        <p id="reason"></p>
        <p id="latency"></p>
        <div id="evidence"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
